<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#281b15">
    <title>Hammerschlagen</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
    <main class="shell">
      <header class="masthead">
        <h1>Hammer<span>schlagen</span></h1>
      </header>

      <section id="landing" class="panel landing">
        <p class="eyebrow">A multiplayer stump-side showdown.</p>
        <h2>Hammer, Drink, Repeat.</h2>
        <div class="divider"><span>Host a Game</span></div>
        <button id="create-room" class="button button-primary">Create a Tournament Room</button>
        <div class="backup-restore">
          <label for="backup-file">Restore a tournament backup<input id="backup-file" type="file" accept=".json,application/json"></label>
          <button id="restore-backup" class="button button-secondary" type="button" disabled>Restore</button>
        </div> 
        <div class="divider"><span>Join a Room</span></div>
        <form id="join-form" class="join-form">
          <label>Room code<input id="room-code" name="code" maxlength="4" autocomplete="off" required></label>
          <button class="button button-secondary" type="submit">Enter room</button>
        </form>
        <div class="divider"><span>or Rejoin a Tournament (Enter Room Code Above)</span></div>
        <form id="rejoin-form" class="join-form">
          <label>Your name<input id="player-name" maxlength="32" autocomplete="nickname"></label>
          <button id="rejoin-game" class="button button-secondary" type="button" disabled>Rejoin using room code and name</button>
        </form>
        <p id="landing-error" class="error" role="status"></p>
      </section>

      <section id="host-view" class="hidden"></section>
      <section id="player-view" class="hidden"></section>
    </main>
  </body>
</html>
